page_title: デモ
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: コンポーネントの初期化
    intro: コンポーネントをDOM要素にバインドする方法はいくつかあります。各メソッドはコンポーネントがどの要素をルートとして使用するかを決定します。
init:
  parent:
    title: 親を介して
    body: コンポーネントは、その含まれているDOM要素をルートとして使用します。
  previous:
    title: 前の要素を介して
    body: コンポーネントは、前の兄弟DOM要素をルートとして使用します。
  class:
    title: CSSクラスを介して
    body: コンポーネントは、自動生成されたCSSクラスを持つDOM要素をルートとして使用します。
  server_side:
    title: サーバーサイドコンポーネント
    body: サーバー上のPHPクラスによって生成されます。ファイルの読み取り、データベースのクエリ、サービスの使用、またはレンダリング中のページコンテンツの変更を可能にします。
