section:
  init:
    title: 'কম্পোনেন্ট ইনিশিয়ালাইজেশন'
    intro: 'একটি কম্পোনেন্টকে একটি DOM উপাদানের সাথে যুক্ত করার কয়েকটি উপায় রয়েছে। প্রতিটি পদ্ধতি নির্ধারণ করে কোন উপাদানটি কম্পোনেন্টটি তার মূল হিসেবে ব্যবহার করবে।'
init:
  parent:
    title: 'প্যারেন্টের মাধ্যমে'
    body: 'কম্পোনেন্টটি তার ধারণকারী DOM উপাদানটিকে তার মূল হিসেবে ব্যবহার করে।'
  previous:
    title: 'পূর্ববর্তী উপাদানের মাধ্যমে'
    body: 'কম্পোনেন্টটি পূর্ববর্তী সিবলিং DOM উপাদানটিকে তার মূল হিসেবে ব্যবহার করে।'
  class:
