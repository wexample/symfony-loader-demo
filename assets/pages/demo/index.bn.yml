  server_side:
    title: 'সার্ভার-সাইড কম্পোনেন্ট'
    body: 'সার্ভারে একটি PHP ক্লাস দ্বারা উত্পন্ন। ফাইল পড়া, ডাটাবেসে প্রশ্ন করা, পরিষেবাগুলি ব্যবহার করা বা রেন্ডারিংয়ের সময় পৃষ্ঠা বিষয়বস্তু পরিবর্তন করার অনুমতি দেয়।'
