page_title: Demo
page_icon: ph:bold/puzzle-piece

section:
  init:
    title: Component Initialization
    intro: There are several ways to bind a component to a DOM element. Each method determines which element the component will use as its root.

init:
  parent:
    title: Via the parent
    body: The component uses its containing DOM element as its root.
  previous:
    title: Via the previous element
    body: The component uses the preceding sibling DOM element as its root.
  class:
    title: Via a CSS class
    body: The component uses the DOM element carrying the auto-generated CSS class as its root.
  server_side:
    title: Server-side component
    body: Produced by a PHP class on the server. Allows reading files, querying the database, using services, or altering page content during rendering.
