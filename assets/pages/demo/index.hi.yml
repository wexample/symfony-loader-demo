page_title: डेमो
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: 'घटक प्रारंभ'
    intro: 'एक घटक को DOM तत्व से बंधने के कई तरीके हैं। प्रत्येक विधि निर्धारित करती है कि घटक किस तत्व का उपयोग अपने मूल के रूप में करेगा।'
init:
  parent:
    title: 'माता-पिता के माध्यम से'
    body: 'घटक अपने समावेशी DOM तत्व का उपयोग अपने मूल के रूप में करता है।'
  previous:
    title: 'पिछले तत्व के माध्यम से'
    body: 'घटक पूर्ववर्ती भाई DOM तत्व का उपयोग अपने मूल के रूप में करता है।'
  class:
    title: 'CSS वर्ग के माध्यम से'
    body: 'घटक उस DOM तत्व का उपयोग करता है जो स्वचालित रूप से उत्पन्न CSS वर्ग को ले जाता है, अपने मूल के रूप में।'
  server_side:
    title: 'सर्वर-साइड घटक'
    body: 'सर्वर पर PHP वर्ग द्वारा उत्पन्न। फ़ाइलें पढ़ने, डेटाबेस को क्वेरी करने, सेवाओं का उपयोग करने या रेंडरिंग के दौरान पृष्ठ सामग्री को बदलने की अनुमति देता है।'
