page_title: Demostración
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: 'Inicialización del Componente'
    intro: 'Hay varias formas de vincular un componente a un elemento del DOM. Cada método determina qué elemento utilizará el componente como su raíz.'
init:
  parent:
    title: 'A través del padre'
    body: 'El componente utiliza su elemento DOM contenedor como su raíz.'
  previous:
    title: 'A través del elemento anterior'
    body: 'El componente utiliza el elemento DOM hermano anterior como su raíz.'
  class:
    title: 'A través de una clase CSS'
    body: 'El componente utiliza el elemento DOM que lleva la clase CSS autogenerada como su raíz.'
  server_side:
    title: 'Componente del lado del servidor'
    body: 'Producido por una clase PHP en el servidor. Permite leer archivos, consultar la base de datos, usar servicios o alterar el contenido de la página durante el renderizado.'
