page_title: ڈیمو
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: 'اجزاء کی ابتدائی ترتیب'
    intro: 'اجزاء کو DOM عنصر سے باندھنے کے کئی طریقے ہیں۔ ہر طریقہ طے کرتا ہے کہ جزو کس عنصر کو اپنی جڑ کے طور پر استعمال کرے گا۔'
init:
  parent:
    title: 'والد کے ذریعے'
    body: 'جزو اپنے موجودہ DOM عنصر کو اپنی جڑ کے طور پر استعمال کرتا ہے۔'
  previous:
    title: 'پچھلے عنصر کے ذریعے'
    body: 'جزو پچھلے ہم جماعت DOM عنصر کو اپنی جڑ کے طور پر استعمال کرتا ہے۔'
  class:
    title: 'CSS کلاس کے ذریعے'
    body: 'جزو اس DOM عنصر کو اپنی جڑ کے طور پر استعمال کرتا ہے جس پر خودکار طور پر تیار کردہ CSS کلاس ہو۔'
  server_side:
    title: 'سرور سائیڈ جزو'
    body: 'سرور پر ایک PHP کلاس کے ذریعے تیار کردہ۔ فائلیں پڑھنے، ڈیٹا بیس کی تلاش، خدمات استعمال کرنے، یا رینڈرنگ کے دوران صفحے کے مواد میں تبدیلی کی اجازت دیتا ہے۔'
