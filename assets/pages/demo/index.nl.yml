    title: Componentinitialisatie
    intro: 'Er zijn verschillende manieren om een component aan een DOM-element te binden. Elke methode bepaalt welk element de component als zijn wortel zal gebruiken.'
init:
  parent:
    title: 'Via de bovenliggende'
    body: 'De component gebruikt zijn omhullende DOM-element als zijn wortel.'
  previous:
    title: 'Via het vorige element'
    body: 'De component gebruikt het voorgaande broeder DOM-element als zijn wortel.'
  class:
    title: 'Via een CSS-klasse'
    body: 'De component gebruikt het DOM-element met de automatisch gegenereerde CSS-klasse als zijn wortel.'
  server_side:
    title: 'Server-side component'
    body: 'Gemaakt door een PHP-klasse op de server. Maakt het mogelijk om bestanden te lezen, de database te bevragen, services te gebruiken of de pagina-inhoud tijdens het renderen te wijzigen.'
