page_title: เดโม
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: การเริ่มต้นส่วนประกอบ
    intro: 'มีหลายวิธีในการเชื่อมโยงส่วนประกอบกับองค์ประกอบ DOM โดยแต่ละวิธีจะกำหนดว่าองค์ประกอบใดที่ส่วนประกอบจะใช้เป็นรากของมัน.'
init:
  parent:
    title: ผ่านผู้ปกครอง
    body: 'ส่วนประกอบใช้องค์ประกอบ DOM ที่บรรจุอยู่เป็นรากของมัน.'
  previous:
    title: ผ่านองค์ประกอบก่อนหน้า
    body: 'ส่วนประกอบใช้องค์ประกอบ DOM พี่น้องก่อนหน้าเป็นรากของมัน.'
  class:
    title: 'ผ่านคลาส CSS'
    body: 'ส่วนประกอบใช้องค์ประกอบ DOM ที่มีคลาส CSS ที่สร้างขึ้นอัตโนมัติเป็นรากของมัน.'
  server_side:
    title: ส่วนประกอบฝั่งเซิร์ฟเวอร์
    body: 'สร้างโดยคลาส PHP บนเซิร์ฟเวอร์ ช่วยให้สามารถอ่านไฟล์ สอบถามฐานข้อมูล ใช้บริการ หรือแก้ไขเนื้อหาหน้าในระหว่างการเรนเดอร์.'
