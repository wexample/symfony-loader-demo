page_title: دمو
page_icon: 'ph:bold/puzzle-piece'
section:
  init:
    title: 'راه‌اندازی کامپوننت'
    intro: 'چندین روش برای اتصال یک کامپوننت به یک عنصر DOM وجود دارد. هر روش تعیین می‌کند که کدام عنصر به عنوان ریشه کامپوننت استفاده شود.'
init:
  parent:
    title: 'از طریق والد'
    body: 'این کامپوننت از عنصر DOM حاوی خود به عنوان ریشه استفاده می‌کند.'
  previous:
    title: 'از طریق عنصر قبلی'
    body: 'این کامپوننت از عنصر DOM خواهر قبلی به عنوان ریشه استفاده می‌کند.'
  class:
    title: 'از طریق یک کلاس CSS'
    body: 'این کامپوننت از عنصر DOM که کلاس CSS به‌صورت خودکار تولید شده را به عنوان ریشه استفاده می‌کند.'
  server_side:
    title: 'کامپوننت سمت سرور'
    body: 'تولید شده توسط یک کلاس PHP در سرور. اجازه می‌دهد تا فایل‌ها را بخوانید، پایگاه داده را استعلام کنید، از خدمات استفاده کنید، یا محتوای صفحه را در هنگام رندر تغییر دهید.'
